name: Build and Release Multiplatform App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (leave empty for testing build without creating release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. Android APK Build
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Rename and Prepare Artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk PeiPal-android-release.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PeiPal-android-release
          path: PeiPal-android-release.apk
          retention-days: 7

  # -------------------------------------------------------------
  # 2. macOS DMG Build
  # -------------------------------------------------------------
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS App
        run: flutter build macos --release

      - name: Create DMG
        run: |
          hdiutil create -volname "PeiPal" \
            -srcfolder "build/macos/Build/Products/Release/PeiPal.app" \
            -ov -format UDZO \
            "PeiPal-macOS.dmg"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PeiPal-macOS
          path: PeiPal-macOS.dmg
          retention-days: 7

  # -------------------------------------------------------------
  # 3. Windows Application Build (Installer EXE & Portable ZIP)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Compress Release Folder to Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "PeiPal-Windows-x64-Portable.zip"

      - name: Build Windows Setup Installer with Inno Setup
        shell: pwsh
        run: |
          if (!(Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress
            $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          }
          iscc /O. windows/packaging/installer.iss
          Get-Item PeiPal-Windows-x64-Setup.exe

      - name: Upload Windows Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: PeiPal-Windows-x64-Setup
          path: PeiPal-Windows-x64-Setup.exe
          retention-days: 7

      - name: Upload Windows Portable Zip
        uses: actions/upload-artifact@v4
        with:
          name: PeiPal-Windows-x64-Portable
          path: PeiPal-Windows-x64-Portable.zip
          retention-days: 7

  # -------------------------------------------------------------
  # 4. Publish GitHub Release
  # -------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: PeiPal-android-release
          path: release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: PeiPal-macOS
          path: release-assets

      - name: Download Windows Setup Installer
        uses: actions/download-artifact@v4
        with:
          name: PeiPal-Windows-x64-Setup
          path: release-assets

      - name: Download Windows Portable Zip
        uses: actions/download-artifact@v4
        with:
          name: PeiPal-Windows-x64-Portable
          path: release-assets

      - name: Determine Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Release ${{ steps.tag_info.outputs.tag }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------
      # 5. Sync Release Assets to Gitee
      # -------------------------------------------------------------
      - name: Sync Release Assets to Gitee
        if: env.GITEE_TOKEN != ''
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ steps.tag_info.outputs.tag }}
        run: |
          python3 - << 'EOF'
          import os
          import glob
          import urllib.request
          import urllib.parse
          import json
          import subprocess

          gitee_token = os.environ.get("GITEE_TOKEN", "").strip()
          tag = os.environ.get("RELEASE_TAG", "").strip()
          owner = "xinggue"
          repo = "peipal_app"

          if not gitee_token:
              print("No GITEE_TOKEN provided, skipping Gitee release sync.")
              exit(0)

          print(f"Syncing release {tag} to Gitee ({owner}/{repo})...")

          # 1. Check if release already exists on Gitee
          get_url = f"https://gitee.com/api/v5/repos/{owner}/{repo}/releases/tags/{tag}?access_token={gitee_token}"
          release_id = None

          try:
              req = urllib.request.Request(get_url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req) as resp:
                  if resp.status == 200:
                      data = json.loads(resp.read().decode())
                      release_id = data.get("id")
                      print(f"Found existing Gitee release ID: {release_id}")
          except Exception as e:
              print(f"Release not found on Gitee by tag ({e}), will create new release.")

          # 2. Create release if not exists
          if not release_id:
              create_url = f"https://gitee.com/api/v5/repos/{owner}/{repo}/releases"
              payload = urllib.parse.urlencode({
                  "access_token": gitee_token,
                  "tag_name": tag,
                  "name": f"Release {tag}",
                  "body": f"PeiPal (小培同学) {tag} 多平台发布版本。\n\n包含 Android 安装包、macOS 镜像、Windows 安装程序及便携版。\n国内镜像高速下载。",
              }).encode("utf-8")

              req = urllib.request.Request(create_url, data=payload, headers={"User-Agent": "Mozilla/5.0", "Content-Type": "application/x-www-form-urlencoded"})
              try:
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode())
                      release_id = data.get("id")
                      print(f"Created new Gitee release ID: {release_id}")
              except Exception as e:
                  print(f"Failed to create Gitee release: {e}")
                  exit(0)

          # 3. Upload release assets
          files = sorted(glob.glob("release-assets/*"))
          print(f"Uploading {len(files)} files to Gitee release {release_id}...")
          for f in files:
              fname = os.path.basename(f)
              print(f"--> Uploading {fname} to Gitee...")
              cmd = [
                  "curl", "-s", "-S", "--retry", "3",
                  "-X", "POST",
                  "-F", f"access_token={gitee_token}",
                  "-F", f"file=@{f}",
                  f"https://gitee.com/api/v5/repos/{owner}/{repo}/releases/{release_id}/attach_files"
              ]
              res = subprocess.run(cmd, capture_output=True, text=True)
              if res.returncode == 0:
                  print(f"Uploaded {fname} successfully.")
              else:
                  print(f"Warning: Failed to upload {fname}: {res.stderr}")

          print("Gitee release synchronization completed!")
          EOF

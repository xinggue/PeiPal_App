name: Build and Release Multiplatform App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (leave empty for testing build without creating release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. Android APK Build
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Release Keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release-keystore.jks

      - name: Write key.properties
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=../release-keystore.jks
          EOF

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Rename and Prepare Artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk PeiPal-android-release.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PeiPal-android-release
          path: PeiPal-android-release.apk
          retention-days: 7

  # -------------------------------------------------------------
  # 2. macOS DMG Build
  # -------------------------------------------------------------
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS App
        run: flutter build macos --release

      - name: Create DMG
        run: |
          hdiutil create -volname "PeiPal" \
            -srcfolder "build/macos/Build/Products/Release/PeiPal.app" \
            -ov -format UDZO \
            "PeiPal-macOS.dmg"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PeiPal-macOS
          path: PeiPal-macOS.dmg
          retention-days: 7

  # -------------------------------------------------------------
  # 3. Windows Application Build (Installer EXE & Portable ZIP)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        shell: pwsh
        run: |
          # windows-latest is en-US (code page 1252). rc.exe and Inno Setup
          # read source as the system ANSI code page unless the file has a UTF-8 BOM.
          $utf8 = New-Object System.Text.UTF8Encoding $true
          foreach ($rel in @("windows\runner\Runner.rc", "windows\packaging\installer.iss")) {
            $path = (Resolve-Path $rel).Path
            $text = [System.IO.File]::ReadAllText($path)
            [System.IO.File]::WriteAllText($path, $text, $utf8)
          }
          flutter build windows --release

      - name: Compress Release Folder to Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "PeiPal-Windows-x64-Portable.zip"

      - name: Build Windows Setup Installer with Inno Setup
        shell: pwsh
        run: |
          if (!(Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress
            $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          }
          iscc /O. windows/packaging/installer.iss
          Get-Item PeiPal-Windows-x64-Setup.exe

      - name: Upload Windows Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: PeiPal-Windows-x64-Setup
          path: PeiPal-Windows-x64-Setup.exe
          retention-days: 7

      - name: Upload Windows Portable Zip
        uses: actions/upload-artifact@v4
        with:
          name: PeiPal-Windows-x64-Portable
          path: PeiPal-Windows-x64-Portable.zip
          retention-days: 7

  # -------------------------------------------------------------
  # 4. Publish GitHub Release
  # -------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: PeiPal-android-release
          path: release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: PeiPal-macOS
          path: release-assets

      - name: Download Windows Setup Installer
        uses: actions/download-artifact@v4
        with:
          name: PeiPal-Windows-x64-Setup
          path: release-assets

      - name: Download Windows Portable Zip
        uses: actions/download-artifact@v4
        with:
          name: PeiPal-Windows-x64-Portable
          path: release-assets

      - name: Determine Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Manifest
        env:
          ASSET_DIR: release-assets
          RELEASE_TAG: ${{ steps.tag_info.outputs.tag }}
        run: python3 .github/scripts/gen_manifest.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Release ${{ steps.tag_info.outputs.tag }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

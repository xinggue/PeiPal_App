name: peipal
description: "Chat-first structured-document collection & generation workstation with BLE HID / QR output; medical records are the primary preset."
publish_to: 'none'
version: 0.1.0+7

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.3.1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^17.3.0

  # HTTP
  dio: ^5.8.0+1

  # BLE
  flutter_blue_plus: ^1.35.3

  # Local Storage
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Media
  record: ^7.0.0
  audioplayers: ^6.4.0
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  flutter_slidable: ^4.0.3
  flutter_image_compress: ^2.5.1
  paddle_ocr_flutter: ^0.0.3
  sqflite_common_ffi: ^2.4.4
  file_selector: ^1.1.0
  syncfusion_flutter_pdf: ^35.1.40+1
  archive: ^4.5.2
  pdfx: ^2.11.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Riverpod Codegen
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15
  riverpod_lint: ^2.6.3
  custom_lint: ^0.7.5

  # JSON Codegen
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/icd_knowledge.db
    - assets/icons/app_icon.png
    - assets/sample/
